<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<div id="content">
    <h1>Mon contenu</h1>
    <p>Texte à exporter en PDF</p>
</div>
<button id="export-pdf">Exporter PDF</button>

<script>
document.getElementById('export-pdf').addEventListener('click', () => {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();

    // Utilisation de html() pour exporter le HTML
    doc.html(document.getElementById('content'), {
        callback: function(doc) {
            doc.save("document.pdf");
        },
        x: 10,
        y: 10
    });
});
</script>
, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
</body>
</html>
